name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix flake check -L

  design:
    name: Design lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/design-lint.sh
      - name: Check that the lint fails on a banned word
        run: |
          # the word is split so this file passes the lint itself
          printf 'A %s%s setup.\n' seam less > "$RUNNER_TEMP/banned.md"
          if bash tools/design-lint.sh "$RUNNER_TEMP/banned.md"; then
            echo "the lint accepted a banned word"; exit 1
          fi

  image:
    # github runners build the image until there is a real builder. artifact on the run.
    name: Bootable image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Allow user namespaces
        # ubuntu blocks unprivileged userns via apparmor, systemd-repart needs them inside the sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        id: build
        run: nix build .#image -L --print-build-logs --keep-failed || { echo "failed=1" >> "$GITHUB_OUTPUT"; exit 1; }
      - name: Diagnose
        if: failure() && steps.build.outputs.failed == '1'
        run: |
          drv=$(nix eval --raw .#nixosConfigurations.eclipse.config.system.build.intermediateImage.drvPath)
          echo "::group::nix log of $drv"
          nix log "$drv" | tail -n 80 || true
          echo "::endgroup::"
          echo "::group::kept build dirs"
          sudo find /nix/var/nix/builds /tmp -maxdepth 1 -type d -name 'nix-*' 2>/dev/null | while read -r d; do
            echo "== $d"; sudo ls -la "$d" | head -n 40
          done
          echo "::endgroup::"
      - name: Compress
        run: |
          sudo apt-get install -y zstd >/dev/null
          img=$(ls result/*.raw | head -n1)
          zstd -T0 -12 "$img" -o eclipse.raw.zst
          ls -la result/ eclipse.raw.zst
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-image-${{ github.sha }}
          path: eclipse.raw.zst
          retention-days: 14

  boot:
    # the image runs here through the flake's vm app: persist partition through a loop device, qemu
    # with kvm, everything over serial
    name: Boot test
    runs-on: ubuntu-latest
    needs: image
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eclipse-image-${{ github.sha }}
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Build the vm app
        run: nix build .#vm -o vm -L
      - name: Install pexpect and zstd
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends python3-pexpect zstd >/dev/null
      - name: Open kvm to the runner
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; else echo "no /dev/kvm, qemu will use tcg"; fi
      - name: Read the test model from the manifest
        id: model
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib
          with open("models/manifest.toml", "rb") as f:
              manifest = tomllib.load(f)
          [model] = [m for m in manifest["chat"] if m.get("test")]
          for key in ("file", "url", "sha256"):
              print(f"{key}={model[key]}")
          EOF
      - name: Cache the test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/cache
          key: model-${{ steps.model.outputs.sha256 }}
      - name: Download the test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: curl -fL --retry 3 --create-dirs -o "models/cache/${{ steps.model.outputs.file }}" "${{ steps.model.outputs.url }}"
      - name: Check the test model
        run: echo "${{ steps.model.outputs.sha256 }}  models/cache/${{ steps.model.outputs.file }}" | sha256sum -c
      - name: Boot
        run: |
          zstd -d --rm eclipse.raw.zst -o eclipse.raw
          printf 'eclipse-test' > pass.txt
          python3 tools/boot-test.py vm/bin/eclipse-vm eclipse.raw pass.txt --models models/cache \
            --log serial.log --splash splash.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-serial-${{ github.sha }}
          path: serial.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-splash-${{ github.sha }}
          path: splash.png
          if-no-files-found: ignore
