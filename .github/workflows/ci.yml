name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix flake check -L

  image:
    # github runners build the image until there is a real builder. artifact on the run.
    name: Bootable image
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 120
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Allow user namespaces
        # ubuntu blocks unprivileged userns via apparmor, systemd-repart needs them inside the sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build
        id: build
        run: nix build .#image -L --print-build-logs --keep-failed || { echo "failed=1" >> "$GITHUB_OUTPUT"; exit 1; }
      - name: Diagnose
        if: failure() && steps.build.outputs.failed == '1'
        run: |
          drv=$(nix eval --raw .#nixosConfigurations.eclipse.config.system.build.intermediateImage.drvPath)
          echo "::group::nix log of $drv"
          nix log "$drv" | tail -n 80 || true
          echo "::endgroup::"
          echo "::group::kept build dirs"
          sudo find /nix/var/nix/builds /tmp -maxdepth 1 -type d -name 'nix-*' 2>/dev/null | while read -r d; do
            echo "== $d"; sudo ls -la "$d" | head -n 40
          done
          echo "::endgroup::"
      - name: Compress
        run: |
          sudo apt-get install -y zstd >/dev/null
          img=$(ls result/*.raw | head -n1)
          zstd -T0 -12 "$img" -o eclipse.raw.zst
          ls -la result/ eclipse.raw.zst
      - uses: actions/upload-artifact@v4
        with:
          name: eclipse-image-${{ github.sha }}
          path: eclipse.raw.zst
          retention-days: 14

  boot:
    # the image runs here: persist partition through a loop device, qemu with kvm, everything over serial
    name: Boot test
    runs-on: ubuntu-latest
    needs: image
    if: ${{ github.event_name != 'pull_request' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eclipse-image-${{ github.sha }}
      - name: Install qemu and the disk tools
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf gdisk cryptsetup btrfs-progs python3-pexpect zstd >/dev/null
      - name: Open kvm to the runner
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; else echo "no /dev/kvm, qemu will use tcg"; fi
      - name: Add the persist partition
        run: |
          zstd -d --rm eclipse.raw.zst -o eclipse.raw
          printf 'eclipse-test' > pass.txt
          sudo tools/persist-image.sh eclipse.raw pass.txt
          sgdisk -p eclipse.raw
      - name: Boot
        run: python3 tools/boot-test.py eclipse.raw pass.txt --log serial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-serial-${{ github.sha }}
          path: serial.log
          if-no-files-found: ignore
