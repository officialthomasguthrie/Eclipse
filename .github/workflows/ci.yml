name: ci

on:
  workflow_dispatch:

jobs:
  probe:
    name: nft probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Versions
        run: |
          set +e
          uname -r
          nft --version || sudo apt-get install -y nftables
          nft --version
          systemctl --version | head -1
          id
          cat /proc/self/cgroup
      - name: User manager
        run: |
          set +e
          sudo loginctl enable-linger "$(id -un)"
          for i in $(seq 30); do [ -S "/run/user/$(id -u)/systemd/private" ] && break; sleep 1; done
          ls -l "/run/user/$(id -u)"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          systemd-run --user --scope --slice app.slice --unit "app-penumbra-yt-dlp-$$" --quiet cat /proc/self/cgroup
          echo "slice status $?"
          systemd-run --user --scope --unit "app-penumbra-noslice-$$" --quiet cat /proc/self/cgroup
          echo "noslice status $?"
      - name: Table
        run: |
          set +e
          for round in 1 2; do
            sudo nft -f - <<'EOF'
          destroy table inet penumbra
          table inet penumbra {
            set off {
              typeof socket cgroupv2 level 5
            }
            chain output {
              type filter hook output priority filter; policy accept;
              socket cgroupv2 level 5 @off drop
            }
            chain input {
              type filter hook input priority filter; policy accept;
              socket cgroupv2 level 5 @off drop
            }
          }
          EOF
            echo "round $round status $?"
          done
          sudo nft list table inet penumbra
          sudo nft -f - <<'EOF'
          table inet typed {
            set off {
              type cgroupsv2
            }
            chain output {
              type filter hook output priority filter; policy accept;
              socket cgroupv2 level 5 @off drop
            }
          }
          EOF
          echo "type cgroupsv2 status $?"
          sudo nft list table inet typed
          sudo nft delete table inet typed
      - name: Traffic
        run: |
          set +e
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          mkdir -p www
          echo reached > www/net.txt
          head -c 20000000 /dev/zero > www/big.bin
          python3 -m http.server 8765 --bind 127.0.0.1 --directory www > http.log 2>&1 &
          sudo ip link add probe0 type dummy
          sudo ip addr add 10.77.0.1/24 dev probe0
          sudo ip link set probe0 up
          python3 -m http.server 8766 --bind 10.77.0.1 --directory www > http2.log 2>&1 &
          sleep 2
          curl -s -m 2 http://10.77.0.1:8766/net.txt
          systemd-run --user --scope --slice app.slice --unit app-penumbra-probe-1 --quiet sh -c '
            echo $$ > scope.pid
            curl -s --limit-rate 500k -o /dev/null -w "long %{http_code} %{size_download} %{exitcode}\n" -m 30 http://10.77.0.1:8766/big.bin &
            for i in $(seq 12); do
              a=$(curl -s -m 2 -o /dev/null -w "%{http_code}" http://127.0.0.1:8765/net.txt)
              b=$(curl -s -m 2 -o /dev/null -w "%{http_code}" http://10.77.0.1:8766/net.txt)
              echo "$i $(date +%s) loopback $a dummy $b"
              sleep 1
            done
            wait' > probe.log 2>&1 &
          sleep 4
          cgroup=$(sed 's/^0:://' "/proc/$(cat scope.pid)/cgroup")
          echo "cgroup $cgroup"
          date +%s
          sudo nft -f - <<EOF
          flush set inet penumbra off
          add element inet penumbra off { "${cgroup#/}" }
          EOF
          echo "add status $?"
          sudo nft list set inet penumbra off
          sleep 6
          date +%s
          sudo nft flush set inet penumbra off
          wait %3 2>/dev/null
          sleep 25
          cat probe.log
          echo "stale:"
          sudo nft -f - <<EOF
          add element inet penumbra off { "${cgroup#/}" }
          EOF
          echo "stale add status $?"
          systemd-run --user --scope --slice app.slice --unit app-penumbra-probe-2 --quiet sh -c 'echo $$ > scope2.pid; sleep 8' &
          sleep 2
          cgroup2=$(sed 's/^0:://' "/proc/$(cat scope2.pid)/cgroup")
          sudo nft add element inet penumbra off "{ \"${cgroup2#/}\" }"
          sleep 10
          echo "after the scope ended:"
          sudo nft list set inet penumbra off
          ls /sys/fs/cgroup/user.slice/user-$(id -u).slice/user@$(id -u).service/app.slice/
      - name: Input from outside the scope
        run: |
          set +e
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          systemd-run --user --scope --slice app.slice --unit app-penumbra-listen-1 --quiet sh -c 'echo $$ > listen.pid; exec python3 -m http.server 8770 --bind 127.0.0.1 --directory www' > listen.log 2>&1 &
          sleep 3
          curl -s -m 2 -o /dev/null -w "before %{http_code}\n" http://127.0.0.1:8770/net.txt
          cgroup=$(sed 's/^0:://' "/proc/$(cat listen.pid)/cgroup")
          sudo nft add element inet penumbra off "{ \"${cgroup#/}\" }"
          curl -s -m 2 -o /dev/null -w "after %{http_code} %{exitcode}\n" http://127.0.0.1:8770/net.txt
          sudo nft flush set inet penumbra off
          curl -s -m 2 -o /dev/null -w "again %{http_code}\n" http://127.0.0.1:8770/net.txt
          kill "$(cat listen.pid)"
