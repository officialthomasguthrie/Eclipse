# models Aura can use. weights never go in git.
# shipped = true means it gets copied to the models subvolume when flashing, the rest download on demand.
# empty sha256 means unpinned; tools/pin-models.sh prints the hashes. permissive licenses only.

schema = 1

# chat, tiered by host memory. syzygy picks, user can override

# the smallest one exists for the boot test in ci: it fits a 4G vm and answers in seconds.
# test = true marks it, nothing ships it. q8 because that is the only quant qwen publishes for it
[[chat]]
id = "qwen3-0.6b-q8_0"
family = "qwen3"
parameters = "0.6B"
quant = "Q8_0"
file = "Qwen3-0.6B-Q8_0.gguf"
