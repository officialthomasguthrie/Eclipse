[package]
name = "librift"
description = "Shared definitions for every Rift component: names, D-Bus addresses, paths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license = "Apache-2.0"

[features]
# the client side of the services on the system bus, for lens and the rift command. off by
# default, so rift-flash builds for macos and windows without it
bus = ["dep:zbus"]
# drives: what lsblk, sfdisk, diskutil and Get-Disk print, the partition tables and the guard, for
# vault and rift-flash. getrandom for new uuids and machine ids on every system
disk = ["dep:serde", "dep:serde_json", "dep:getrandom"]

[dependencies]
zbus = { version = "5.18", default-features = false, features = ["async-io", "blocking-api"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
getrandom = { version = "0.3", optional = true }

[lints]
workspace = true
