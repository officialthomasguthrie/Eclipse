[package]
name = "horizon-lock"
description = "Horizon's lock screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "horizon-lock"
path = "src/main.rs"

[dependencies]
# the text on the screen, in the Noto Sans the system has
ab_glyph = "0.2.32"
fontdb = "0.23.0"
# logind's Lock signal for the session, on the system bus
zbus = { version = "5.18", default-features = false, features = ["async-io", "blocking-api"] }

# the lock surfaces need a wayland session and pam checks the password, both only on linux
[target.'cfg(target_os = "linux")'.dependencies]
nonstick = "0.1.2"
rustix = { version = "1.1", features = ["process"] }
smithay-client-toolkit = "0.20.0"

[lints]
workspace = true
