[package]
name = "orbit"
description = "Orbit: host detection, adaptation, and per-machine memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
librift.workspace = true
# the system bus interface. default features bring the async-io executor and the blocking api
zbus = { version = "5.18", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
