[package]
name = "corona"
description = "Corona: the omnibar shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "corona"
path = "src/main.rs"

[dependencies]
libeclipse.workspace = true
# questions go to aurad on the system bus
zbus = { version = "5.18", default-features = false, features = ["async-io", "blocking-api"] }

# the panel needs a wayland session and layer-shell, so it only exists on linux. the software
# renderer is the one that works on every machine, so wgpu stays out
[target.'cfg(target_os = "linux")'.dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "wayland", "thread-pool"] }
iced_layershell = { version = "0.19.1", default-features = false }

[lints]
workspace = true
