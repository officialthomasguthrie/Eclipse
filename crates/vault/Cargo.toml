[package]
name = "vault"
description = "Vault: Timeline snapshots, encrypted backups, and drive cloning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "vault"
path = "src/main.rs"

[dependencies]
libeclipse.workspace = true
# the system bus interface. blocking takes a snapshot or a restore off the bus's own threads
zbus = { version = "5.18", default-features = false, features = ["async-io", "blocking-api"] }
blocking = "1.6"
# an flock on the snapshot directory, without unsafe code
rustix = { version = "1.1", default-features = false, features = ["fs", "std", "termios"] }
# the backup target, and what rustic and findmnt print with --json
serde.workspace = true
serde_json.workspace = true
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse", "display"] }

[lints]
workspace = true
