[package]
name = "eclipse-cli"
description = "eclipse: the one command-line tool for Eclipse OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "eclipse"
path = "src/main.rs"

[dependencies]
# host, ai and doctor ask the services on the system bus
libeclipse = { workspace = true, features = ["bus"] }
# the free space on persist, without unsafe code
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }

[lints]
workspace = true
