[package]
name = "liftoff-splash"
description = "Liftoff: the text boot, a plymouth splash plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# plymouthd loads the cdylib. the preview example and the tests use the rlib
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ab_glyph = "0.2.32"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
png = "0.18.1"

# the workspace's lints, except that plymouth calls the plugin from C: its one module that talks to
# plymouth allows unsafe code, the rest of the crate denies it
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
