[package]
name = "rift-flash"
description = "rift-flash: writes Rift onto a drive from macOS, Windows, or Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "rift-flash"
path = "src/main.rs"

[dependencies]
# the drive's layout, the guard and the steps that write it, shared with vault's clone. never the bus
# feature, this builds for macos and windows
librift = { workspace = true, features = ["disk"] }
# images compressed with zstd, in rust, so no system needs a c compiler to build this
ruzstd = "0.8"

[target.'cfg(unix)'.dependencies]
# whether it runs as root, a plain fsync on a mac's raw disk, and on linux a passphrase typed without
# echo, without unsafe code
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std", "termios"] }

[lints]
workspace = true
